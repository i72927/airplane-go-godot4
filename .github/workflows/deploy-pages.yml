name: Export Godot 4 Web & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Locate Project & Export Web HTML5
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          PROJ_FILE=$(find . -maxdepth 3 -name "project.godot" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "ERROR: project.godot not found in repository!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ_FILE")
          echo "Found Godot project in: $PROJ_DIR"
          cd "$PROJ_DIR"
          if [ ! -f export_presets.cfg ]; then
            cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          EOF
          fi
          mkdir -p .godot/editor
          godot --headless --editor --quit || true
          godot --headless --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
