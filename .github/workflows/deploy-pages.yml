name: Export Godot 4 Web & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Web HTML5
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          mkdir -p "$HOME/.local/share/godot"
          rm -rf "$HOME/.local/share/godot/export_templates"
          ln -s /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" || ls -la /root/.local/share/godot/export_templates || true

          THREAD_OPT="false"
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.3.stable/web_nothreads_release.zip" ]; then
            THREAD_OPT="true"
          fi

          PROJ_FILE=$(find . -maxdepth 3 -name "project.godot" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"

          cat << EOF > export_presets.cfg
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=${THREAD_OPT}
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=false
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          EOF

          godot --headless --editor --quit || true
          godot -v --headless --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
